name: Démo GitHub Pages
on:
  push:
    branches: [main]
    paths: ["planning/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planning/package-lock.json
      - run: npm ci
        working-directory: planning
      - run: npm run test:demo
        working-directory: planning
      - run: npm run build:demo
        working-directory: planning
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: planning/.pages-build/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier la démo
        id: deployment
        uses: actions/deploy-pages@v4
