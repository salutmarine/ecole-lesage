name: Démo GitHub Pages
on:
  push:
    branches: [main]
    paths: ["planning/**", "showcase/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planning/package-lock.json
      - run: npm ci
        working-directory: planning
      - run: npm run test:demo
        working-directory: planning
      - run: node --test showcase/tests/commerce.test.mjs
      - run: node showcase/scripts/build-site.mjs
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - run: python3 showcase/scripts/verify.py
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/.site-build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier la démo
        id: deployment
        uses: actions/deploy-pages@v4
