<div id="teacher-dispatch-proposal">
<style>
#teacher-dispatch-proposal{--paper:light-dark(#fffdf9,#24221e);--ink:light-dark(#302c25,#f1eadf);--line:light-dark(#dfd8cd,#514a3f);--quiet:light-dark(#6e675d,#c6bcae);--soft:light-dark(#f4f0e8,#322d26);font:14px/1.5 system-ui;color:var(--ink)}
#teacher-dispatch-proposal *{box-sizing:border-box}
#teacher-dispatch-proposal .app{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#teacher-dispatch-proposal header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap}
#teacher-dispatch-proposal .brand{letter-spacing:.18em;font-size:16px}#teacher-dispatch-proposal h2{font-size:23px;margin:0;font-weight:500}#teacher-dispatch-proposal h3{font-size:16px;margin:0;font-weight:500}
#teacher-dispatch-proposal .muted{color:var(--quiet)}#teacher-dispatch-proposal p{margin:4px 0}
#teacher-dispatch-proposal .body{padding:24px}#teacher-dispatch-proposal .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
#teacher-dispatch-proposal button,#teacher-dispatch-proposal select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
#teacher-dispatch-proposal .slots{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}#teacher-dispatch-proposal .slots button{text-align:left;min-width:150px}#teacher-dispatch-proposal .slots button[aria-pressed=true]{border-color:var(--ink);background:var(--soft)}
#teacher-dispatch-proposal .filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:18px 0}#teacher-dispatch-proposal label.filter{display:grid;gap:4px}#teacher-dispatch-proposal .summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
#teacher-dispatch-proposal .student{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}#teacher-dispatch-proposal .student input{width:18px;height:18px;accent-color:var(--ink)}#teacher-dispatch-proposal .student strong{font-weight:500}#teacher-dispatch-proposal .badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;margin-left:6px}#teacher-dispatch-proposal .init{background:light-dark(#e6efdf,#33472c);color:light-dark(#3b532b,#c2ddad)}#teacher-dispatch-proposal .perf{background:light-dark(#f3e4ce,#503c24);color:light-dark(#72501b,#f2d09b)}#teacher-dispatch-proposal .spec{background:light-dark(#eee2f3,#483351);color:light-dark(#684175,#e1bce9)}
#teacher-dispatch-proposal .footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-top:20px}#teacher-dispatch-proposal .primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}#teacher-dispatch-proposal button:disabled{opacity:.45;cursor:default}#teacher-dispatch-proposal .feedback{margin-top:14px;color:light-dark(#35602e,#bcdbad)}
@media(max-width:560px){#teacher-dispatch-proposal .body,#teacher-dispatch-proposal header{padding:16px}#teacher-dispatch-proposal .student{grid-template-columns:24px 1fr}#teacher-dispatch-proposal .status{grid-column:2}#teacher-dispatch-proposal .badge{margin:4px 0}#teacher-dispatch-proposal .slots button{min-width:0;flex:1}}
</style>
<div class="app">
<header><span class="brand">LESAGE</span><span>Espace professeur</span><span class="muted">Proposition · données fictives</span></header>
<div class="body">
<div class="top"><div><h2>Composer ma journée</h2><p class="muted">Aujourd’hui · vendredi 13 novembre</p></div><button type="button" id="dispatch-mine" aria-pressed="false">Mes élèves uniquement</button></div>
<h3>Choisir un créneau</h3>
<div class="slots"><button type="button" data-slot="morning" aria-pressed="true">09:00 – 12:00<br><span class="muted">4 élèves à prendre en charge</span></button><button type="button" data-slot="afternoon" aria-pressed="false">14:00 – 17:00<br><span class="muted">3 élèves à prendre en charge</span></button></div>
<div class="summary"><h3 id="dispatch-title">Élèves de 09:00 à 12:00</h3><span id="dispatch-count" class="muted"></span></div>
<div class="filters"><label class="filter">Niveau<select id="dispatch-level"><option value="">Tous les niveaux</option><option>Initiation</option><option>Perfectionnement</option><option>Spécialisation</option></select></label><label class="filter">Cours<select id="dispatch-course"><option value="">Tous les cours</option><option>Points traditionnels</option><option>Haute couture</option><option>Broderie au ruban</option></select></label><button type="button" id="dispatch-all">Sélectionner les élèves disponibles affichés</button></div>
<div id="dispatch-students"></div>
<div class="footer"><span id="dispatch-selection" aria-live="polite">Aucun élève sélectionné</span><button type="button" class="primary" id="dispatch-confirm" disabled>Prendre en charge les élèves</button></div>
<p id="dispatch-feedback" class="feedback" role="status"></p>
</div></div>
<script>
(()=>{
const root=document.getElementById('teacher-dispatch-proposal');
const rows=[{id:1,name:'Nathan BONNET',course:'Points traditionnels',level:'Initiation',step:'1/6',slot:'morning',owner:''},{id:2,name:'Emma MARTIN',course:'Points traditionnels',level:'Initiation',step:'3/6',slot:'morning',owner:''},{id:3,name:'Alice MOREAU',course:'Haute couture',level:'Perfectionnement',step:'4/8',slot:'morning',owner:''},{id:4,name:'Louis DUBOIS',course:'Broderie au ruban',level:'Spécialisation',step:'2/4',slot:'morning',owner:''},{id:5,name:'Léa PETIT',course:'Haute couture',level:'Perfectionnement',step:'6/8',slot:'morning',owner:'Louise Bernard'},{id:6,name:'Hugo ROBERT',course:'Points traditionnels',level:'Initiation',step:'2/6',slot:'afternoon',owner:''},{id:7,name:'Inès DURAND',course:'Broderie au ruban',level:'Spécialisation',step:'1/4',slot:'afternoon',owner:''},{id:8,name:'Jules THOMAS',course:'Haute couture',level:'Perfectionnement',step:'5/8',slot:'afternoon',owner:''}];
let slot='morning',mine=false;const chosen=new Set();
const q=s=>root.querySelector(s);
function visible(){return rows.filter(r=>r.slot===slot&&(!mine||r.owner==='Moi')&&(!q('#dispatch-level').value||r.level===q('#dispatch-level').value)&&(!q('#dispatch-course').value||r.course===q('#dispatch-course').value))}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{slot,selectedStudents:rows.filter(r=>chosen.has(r.id)).map(r=>r.name),assignedToMe:rows.filter(r=>r.owner==='Moi').map(r=>r.name)},privateContent:{slot,mine,chosen:[...chosen],owners:rows.map(r=>[r.id,r.owner])}}).catch(()=>{})}
function render(){q('#dispatch-title').textContent=slot==='morning'?'Élèves de 09:00 à 12:00':'Élèves de 14:00 à 17:00';q('#dispatch-count').textContent=rows.filter(r=>r.slot===slot&&!r.owner).length+' sans professeur';root.querySelectorAll('[data-slot]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.slot===slot)));q('#dispatch-mine').setAttribute('aria-pressed',String(mine));q('#dispatch-students').innerHTML=visible().map(r=>`<label class="student"><input type="checkbox" data-student="${r.id}" aria-label="Sélectionner ${r.name}" ${r.owner?'disabled':''} ${chosen.has(r.id)?'checked':''}><span><strong>${r.name}</strong><br>${r.course} (${r.step}) <span class="badge ${r.level==='Initiation'?'init':r.level==='Perfectionnement'?'perf':'spec'}">${r.level}</span></span><span class="muted status">${r.owner==='Moi'?'Pris en charge par moi':r.owner?'Avec '+r.owner:'Sans professeur'}</span></label>`).join('')||'<p class="muted">Aucun élève correspondant.</p>';q('#dispatch-selection').textContent=chosen.size?chosen.size+' élève(s) sélectionné(s)':'Aucun élève sélectionné';q('#dispatch-confirm').disabled=!chosen.size}
root.addEventListener('change',e=>{if(e.target.dataset.student){const id=Number(e.target.dataset.student);e.target.checked?chosen.add(id):chosen.delete(id)}else chosen.clear();q('#dispatch-feedback').textContent='';render();save()});root.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{slot=b.dataset.slot;chosen.clear();q('#dispatch-feedback').textContent='';render();save()});q('#dispatch-mine').onclick=()=>{mine=!mine;chosen.clear();render();save()};q('#dispatch-all').onclick=()=>{visible().filter(r=>!r.owner).forEach(r=>chosen.add(r.id));render();save()};q('#dispatch-confirm').onclick=()=>{const count=chosen.size;rows.filter(r=>chosen.has(r.id)).forEach(r=>r.owner='Moi');chosen.clear();render();q('#dispatch-feedback').textContent=count+' élève(s) ajouté(s) à ma journée.';save()};
function restore(s){if(!s)return;slot=s.slot==='afternoon'?'afternoon':'morning';mine=!!s.mine;chosen.clear();(s.chosen||[]).forEach(id=>chosen.add(id));(s.owners||[]).forEach(([id,owner])=>{const r=rows.find(r=>r.id===id);if(r)r.owner=owner});render()}
restore(window.openai?.widgetState?.privateContent);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));render();
})();
</script>
</div>
