services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ecole
            POSTGRES_PASSWORD: ecole_dev
            POSTGRES_DB: ecole
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ecole -d ecole']
            interval: 5s
            timeout: 3s
            retries: 10
volumes:
    postgres_data:
